title: Argo CD
created: 2025-04-18
tldr:
- Argo CD to deklaratywne narzędzie GitOps do continuous delivery dla Kubernetes.
- Definicje aplikacji, konfiguracje i środowiska powinny być deklaratywne i wersjonowane.
- Narzędzie automatyzuje wdrażanie aplikacji i zarządzanie ich cyklem życia, zapewniając audytowalność
  oraz interfejs UI.
