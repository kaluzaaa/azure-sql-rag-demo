title: Make | AI Workflow Automation Software & Tools | Make
created: 2025-12-19
tldr:
- Make to wizualna platforma automatyzacji AI do tworzenia i zarządzania workflow oraz agentami AI, także
  za pomocą kodu lub promptu.
- Platforma łączy ponad 3 000 aplikacji i integracji; automatyzacje można budować przez prompt, drag-and-drop
  lub MCP.
- Make deklaruje zaufanie ponad 400 000 organizacji w ponad 200 krajach; firma powstała w 2015 roku i
  należy do Celonis.
- Zabezpieczenia obejmują zgodność z GDPR, SOC 3 i SOC 2 Type II, szyfrowanie oraz single sign-on (SSO).
- Darmowy plan nie wymaga karty kredytowej i nie ma limitu czasowego.
