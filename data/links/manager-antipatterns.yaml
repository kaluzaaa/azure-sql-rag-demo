title: Manager Antipatterns
created: 2025-04-02
tldr:
- Firmy wielokrotnie popełniają te same błędy w zarządzaniu; artykuł zbiera je jako „manager antipatterns”.
- Każdy wzorzec zawiera wskazówki, jak reagować, gdy pracuje się dla takiego menedżera, zarządza nim lub
  samemu nim jest.
- Lista obejmuje m.in. Absentee Manager, Bomb Manager, Laissez-Faire Manager, Perfectionist Manager i
  Tech-Lead Manager.
