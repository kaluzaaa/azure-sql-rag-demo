url: https://modelcontextprotocol.io/examples
title: Example Servers - Model Context Protocol
created: 2025-09-26
tldr:
- Oficjalne serwery referencyjne MCP pokazują obsługę prompts, resources i tools oraz dostęp do plików,
  Git, pamięci, czasu i treści WWW.
- Lista obejmuje serwery Everything, Fetch, Filesystem, Git, Memory, Sequential Thinking i Time.
- Serwery TypeScript można uruchamiać przez npx, a serwery Python przez uvx lub pip.
- Strona pokazuje konfigurację serwerów MCP w Claude, w tym ustawienia poleceń, argumentów i tokenu GitHub.
