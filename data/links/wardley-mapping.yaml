url: https://learnwardleymapping.com
title: Wardley Mapping
author: Ben Mosior
created: 2025-07-23
tldr:
- Strona oferuje kurs Pragmatic Wardley Mapping, który uczy tworzenia map Wardleya i wykorzystywania ich
  do odkrywania możliwości strategicznych.
- 'Kurs obejmuje 7 modułów: 75 minut materiałów wideo oraz 298 minut bonusowych materiałów, ćwiczeń i
  zasobów referencyjnych.'
- Cena kursu wynosi 149 USD za jednorazowy zakup z dożywotnim dostępem; dostępna jest 30-dniowa gwarancja
  zwrotu pieniędzy.
- W kursie znajdują się biblioteka map Wardleya i nagrania studiów przypadków, w tym przykłady dotyczące
  Toyoty.
- Strona udostępnia też bezpłatną książkę Simona Wardleya oraz materiały referencyjne dotyczące Purpose,
  Landscape, Climate, Doctrine i Leadership.
