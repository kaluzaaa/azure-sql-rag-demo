url: https://developer.1password.com/docs/cli/secrets-config-files
title: Load Secrets Into Config Files - 1Password Developer
created: 2025-05-22
tldr:
- 1Password CLI pozwala ładować sekrety do plików konfiguracyjnych za pomocą secret references, bez umieszczania
  jawnych sekretów w kodzie.
- W szablonie konfiguracji zastąp sekrety odwołaniami, np. `op://prod/mysql/password`, a następnie użyj
  `op inject -i config.yml.tpl -o config.yml`.
- Polecenie `op inject` zapisuje rozwiązane sekrety w pliku wyjściowym; usuń ten plik, gdy nie jest już
  potrzebny.
- Zmienne, takie jak `$APP_ENV`, pozwalają używać tego samego szablonu dla różnych środowisk.
- Dokumentacja zaleca Service Accounts z ograniczonym dostępem do vaultów oraz opisuje użycie 1Password
  Connect i `op inject` w produkcji.
