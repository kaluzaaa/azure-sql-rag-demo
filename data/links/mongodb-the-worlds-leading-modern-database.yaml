url: https://www.mongodb.com
title: 'MongoDB: The World’s Leading Modern Database'
created: 2025-04-18
tldr:
- MongoDB Atlas łączy dane operacyjne, wektorowe i strumieniowe na jednej platformie przeznaczonej m.in.
  do budowania aplikacji AI.
- Atlas Vector Search umożliwia wyszukiwanie semantyczne, systemy rekomendacji, Q&A, wykrywanie anomalii
  i dostarczanie kontekstu dla generatywnej AI.
- Atlas Stream Processing obsługuje aplikacje event-driven reagujące niemal w czasie rzeczywistym na strumienie,
  np. z Apache Kafka, przy użyciu etapów MongoDB Aggregation Pipeline.
- Platforma obejmuje także obsługę transakcji ACID, wyszukiwanie tekstowe, analitykę, grafy i dane geoprzestrzenne.
- MongoDB deklaruje, że MongoDB Search na Atlas może połączyć bazę, wyszukiwarkę i mechanizmy synchronizacji,
  zapewniając dostarczanie wyników 30–50% szybciej.
- Przykłady klientów obejmują migrację 200 baz Victoria’s Secret do Atlas w 4 miesiące oraz dostępność
  99,99% usług Toyota Connected.
