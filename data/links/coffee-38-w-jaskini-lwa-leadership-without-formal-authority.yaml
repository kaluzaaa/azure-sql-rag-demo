title: 'Coffee #38: W jaskini LWA - Leadership Without (Formal) Authority'
author: Sebastian Gębski, Wojtek Ptak i Tomek Onyszko
created: 2025-03-07
tldr:
- Leadership Without (Formal) Authority polega na wpływaniu na ludzi i kierunku działań bez wydawania
  formalnych poleceń; łączy się z ownership i odpowiedzialnością za wspólny cel.
- Przykładami są architekt wpływający na pracę wielu zespołów, gildie oraz organizacje macierzowe, w których
  różne wymiary odpowiedzialności nie mają jednej wspólnej hierarchii.
- Organizacja powinna wspierać inicjatywy, zapewniać autonomię i wspólne cele oraz nie tłumić działań
  podejmowanych bez każdorazowego pytania o pozwolenie.
- Przydatne umiejętności to komunikacja, budowanie relacji i zaufania, rozpoznawanie motywacji rozmówców
  oraz dostosowanie sposobu przekonywania do sytuacji.
- Wpływ można budować przez wspieranie sukcesu innych i ostrożne gospodarowanie zaufaniem; uczestnicy
  wskazują też na Nemawashi i modele perswazji.
- Największą nagrodą za takie działania bywa poczucie wpływu i satysfakcja, a nie formalna gratyfikacja
  finansowa.
