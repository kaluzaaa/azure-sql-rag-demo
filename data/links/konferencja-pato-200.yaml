title: 'Konferencja Pato #200'
created: 2026-01-08
tldr:
- Jednodniowa konferencja odbędzie się 16 czerwca 2026 roku w godzinach 9:00-17:00 w Sky Hall na ulicy
  Twardej 18 w Warszawie
- Wydarzenie stanowi celebrację 200. odcinka podcastu Patoarchitekci, prowadzonego przez dwóch gospodarzy
- W programie zaplanowano 5 prelekcji oraz udział trzech zaproszonych gości specjalnych
- Konferencja zakończy się nagraniem 200. odcinka podcastu na żywo przed publicznością
- Cena biletu obejmuje wszystkie prelekcje, sesje networkingowe, lunch oraz przerwy kawowe
- Partnerem wydarzenia jest firma Protopia, specjalizująca się w rozwiązaniach cloud i AI
