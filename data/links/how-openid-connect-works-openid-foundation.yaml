url: https://openid.net/connect
title: How OpenID Connect Works - OpenID Foundation
created: 2025-04-18
tldr:
- OpenID Connect to protokół uwierzytelniania oparty na OAuth 2.0, który pozwala aplikacjom weryfikować
  tożsamość użytkowników i pobierać ich dane profilu.
- W typowym przepływie aplikacja przekierowuje użytkownika do OpenID Provider, który go uwierzytelnia
  i zwraca Identity Token oraz zwykle Access Token.
- Identity Token zawiera co najmniej identyfikator użytkownika oraz informacje o tym, jak i kiedy nastąpiło
  uwierzytelnienie; UserInfo Endpoint może zwracać dodatkowe Claims.
- Protokół obsługuje aplikacje webowe, mobilne i JavaScript, a rozszerzenia obejmują m.in. szyfrowanie
  danych tożsamości, discovery dostawców i wylogowanie sesji.
- OpenID Connect korzysta ze standardowych struktur JWT i JSON/HTTP; może obsługiwać przypadki użycia
  SAML, a także aplikacje natywne i mobilne.
