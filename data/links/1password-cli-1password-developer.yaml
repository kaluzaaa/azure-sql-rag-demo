url: https://developer.1password.com/docs/cli
title: 1Password CLI - 1Password Developer
created: 2025-05-22
tldr:
- 1Password CLI udostępnia funkcje 1Password w terminalu, umożliwiając logowanie biometryczne i bezpieczny
  dostęp do danych potrzebnych podczas developmentu.
- CLI służy do tworzenia i pobierania elementów oraz zarządzania użytkownikami i ich uprawnieniami do
  vaultów i grup.
- Sekrety można ładować jako zmienne środowiskowe, odwoływać się do nich przez secret references i wstrzykiwać
  do plików konfiguracyjnych.
- Shell plugins pozwalają uwierzytelniać biometrycznie obsługiwane narzędzia CLI innych firm; można też
  tworzyć własne pluginy.
- Integracje obejmują VS Code, Service Accounts, 1Password Environments, Connect Server, CI/CD Integrations
  i Events API.
- Dokumentacja zawiera pełny wykaz poleceń, najlepsze praktyki, informacje o integracji z aplikacją 1Password
  i modelu bezpieczeństwa shell plugins.
