url: https://developer.1password.com/docs/cli/secrets-scripts
title: Load secrets into scripts - 1Password Developer
created: 2025-05-22
tldr:
- 1Password CLI udostępnia kilka sposobów wczytywania sekretów do skryptów bez zapisywania poświadczeń
  w nich w postaci jawnego tekstu.
- '`op run` przekazuje do procesu zmienne z 1Password Environment albo ładuje sekrety wskazane przez secret
  reference URIs; obsługa Environments wymaga wersji beta CLI 2.33.0-beta.02 lub nowszej.'
- '`op read` pobiera sekrety bezpośrednio w skrypcie lub ustawia nimi zmienne środowiskowe, a `op inject`
  wstawia je do plików konfiguracyjnych podczas uruchomienia.'
- '`op plugin run` używa shell plugins do uwierzytelniania narzędzi, takich jak AWS CLI; do integracji
  i automatyzacji strona zaleca Service Accounts z dostępem ograniczonym do potrzebnych vaultów.'
