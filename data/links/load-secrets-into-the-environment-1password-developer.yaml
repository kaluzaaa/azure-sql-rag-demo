url: https://developer.1password.com/docs/cli/secrets-environment-variables
title: Load secrets into the environment - 1Password Developer
created: 2025-05-22
tldr:
- '`op run` udostępnia aplikacji sekrety z 1Password jako zmienne środowiskowe tylko na czas działania
  procesu podrzędnego, bez wpisywania ich jawnie w kodzie.'
- Sekrety można ładować z 1Password Environments (beta), przez secret references w plikach `.env` lub
  zmiennych środowiskowych albo łączyć te metody.
- 'Przykładowe polecenie dla Environment: `op run --environment <environmentID> -- <command>`; dla pliku:
  `op run --env-file="./prod.env" -- aws`.'
- Secret references mają postać URI wskazujących vault, item, sekcję i pole; zmienne w URI, takie jak
  `$APP_ENV`, pozwalają wybierać sekrety dla środowisk dev i prod.
- Dokumentacja zaleca uwierzytelnianie przez Service Account z dostępem ograniczonym do potrzebnych vaultów
  i Environments. Dla Environments beta wymagany jest 1Password CLI `2.33.0-beta.02` lub nowszy.
