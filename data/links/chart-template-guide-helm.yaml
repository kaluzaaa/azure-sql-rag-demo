title: Chart Template Guide | Helm
created: 2025-12-04
tldr:
- Szablony Helm generują manifesty YAML opisujące zasoby zrozumiałe dla Kubernetes.
- Przewodnik dla Helm 4.3.0 omawia język szablonów, strukturę chartów oraz pisanie i debugowanie szablonów
  Go.
- Opisuje używanie values, wbudowane obiekty, funkcje i pipelines, sterowanie przepływem oraz zmienne.
- Obejmuje named templates, dostęp do plików, pliki NOTES.txt, subcharts i wartości globalne.
- Zawiera wskazówki dotyczące pliku .helmignore oraz technik YAML i typów danych Go.
