title: ONYSZKO & FURMANKIEWICZ - HOW TO BECOME CLOUD ARCHITECT, CTO, CONSULTANT?
created: 2025-03-07
tldr:
- Lider techniczny wywiera wpływ poza własnym zespołem, rozwija ludzi i wspiera cele biznesowe; nie musi
  być najlepszym programistą ani najinteligentniejszą osobą w pokoju.
- 'Prelegenci rozróżniają role konsultanta, architekta, CTO, VP/head of engineering i program managera:
  mają inne zakresy odpowiedzialności, odbiorców i wyniki pracy.'
- 'Awans do przywództwa oznacza zmianę pracy: potrzebne są rozumienie biznesu, współpraca bez formalnej
  władzy, jasna komunikacja i umiejętność przekonywania interesariuszy.'
- Warto opierać decyzje na danych, kwestionować własne założenia i ustalać oczekiwania; nieudokumentowana
  opinia może prowadzić do kosztownych błędów.
- Skuteczne przywództwo wymaga delegowania, udzielania konkretnego feedbacku, priorytetyzacji, brania
  odpowiedzialności za decyzje oraz akceptacji porażek.
- Prelegenci podkreślają znaczenie słuchania, pisania i mówienia, a także dbania o sen, ćwiczenia i odpoczynek
  przy dużym stresie.
