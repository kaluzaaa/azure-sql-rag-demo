title: Pato 200 - konferencja
created: 2026-04-16
tldr:
- 'Jednodniowa konferencja Pato #200 odbędzie się 16 czerwca 2026 w Warszawie; wydarzenie celebruje 200.
  odcinek podcastu nagrywany na żywo.'
- Program obejmuje prelekcje i Q&A o projektowaniu systemów, observability, Kubernetes, event sourcing
  oraz praktykach architektonicznych.
- 'Wystąpią Łukasz Kałużny, Szymon Warda, Oskar Dudycz, Mariusz Gil i Mariusz Dalewski; finałem będzie
  panel z nagraniem odcinka #200.'
- Konferencja potrwa od 9:00 do 17:00 w Sky Hall przy ul. Twardej 18; bilety kosztowały 359 zł netto i
  zostały wyprzedane.
- W cenie były lunch, kawa, przekąski, networking oraz dostęp do dedykowanego kanału Discord.
