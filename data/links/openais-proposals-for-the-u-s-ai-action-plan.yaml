url: https://openai.com/global-affairs/openai-proposals-for-the-us-ai-action-plan
title: OpenAI’s proposals for the U.S. AI Action Plan
author: OpenAI
created: 2025-04-02
tldr:
- OpenAI przedstawiło OSTP propozycje do amerykańskiego AI Action Plan, które mają wzmocnić przywództwo
  USA w AI, wzrost gospodarczy i bezpieczeństwo narodowe.
- Firma proponuje regulacje wspierające innowacje i dobrowolną współpracę rządu z sektorem prywatnym,
  a także ograniczenie wpływu obciążających przepisów stanowych.
- Strategia eksportowa ma promować globalne wdrażanie amerykańskich systemów AI i chronić przewagę USA,
  między innymi przez aktualizację AI diffusion rule.
- OpenAI postuluje ochronę praw twórców przy zachowaniu możliwości trenowania modeli na materiałach chronionych
  prawem autorskim.
- Propozycje infrastrukturalne obejmują inwestycje w energetykę i sieć energetyczną oraz rozwój kadr;
  według OpenAI mogą wspierać setki tysięcy miejsc pracy.
- Rząd USA ma bezpiecznie wdrażać frontier AI w administracji, bezpieczeństwie i wojsku, modernizując
  procesy w tempie sektora prywatnego.
