tldr:
- 'Simon Sinek przedstawia Golden Circle: inspirujący liderzy zaczynają komunikację od „dlaczego”, potem
  wyjaśniają „jak” i „co”; ludzie kupują powód działania, nie sam produkt.'
- Organizacje, które jasno komunikują swój cel i przekonania, przyciągają klientów oraz pracowników podzielających
  te wartości.
- Przykłady Apple, braci Wright, TiVo i Martina Luthera Kinga pokazują, jak wspólna misja może inspirować
  do działania i wspierać akceptację nowych idei.
- Według prawa dyfuzji innowacji, masowa akceptacja pojawia się po osiągnięciu około 15–18% penetracji
  rynku.
