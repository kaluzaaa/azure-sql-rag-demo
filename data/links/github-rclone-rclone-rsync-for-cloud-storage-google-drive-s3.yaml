url: https://github.com/rclone/rclone
title: 'GitHub - rclone/rclone: "rsync for cloud storage" - Google Drive, S3, Dropbox, Backblaze B2, One
  Drive, Swift, Hubic, Wasabi, Google Cloud Storage, Azure Blob, Azure Files, Yandex Files'
author: rclone
created: 2025-05-22
tldr:
- rclone to program CLI do synchronizacji plików i katalogów z różnymi usługami cloud storage.
- Obsługuje m.in. Google Drive, Amazon S3, Dropbox, Backblaze B2, Microsoft OneDrive, Azure Blob Storage
  i Google Cloud Storage.
- Lista integracji obejmuje też protokoły i systemy takie jak FTP, SFTP, WebDAV, HTTP, HDFS oraz OpenStack
  Swift.
- Repozytorium zawiera kod w Go; strona podaje 59 975 stars i 5 447 forks.
