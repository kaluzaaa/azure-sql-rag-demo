url: https://kubernetes.io/docs/tasks/configmap-secret/managing-secret-using-kustomize
title: Managing Secrets using Kustomize
created: 2025-12-04
tldr:
- Kustomize `secretGenerator` tworzy obiekty Secret z wartości literalnych, plików lub plików `.env`;
  danych nie trzeba kodować do base64.
- Plik konfiguracji musi nazywać się `kustomization.yaml` lub `kustomization.yml`, a Secret można utworzyć
  poleceniem `kubectl apply -k <directory-path>`.
- Kustomize dodaje do nazwy Secret hash danych; po ich zmianie tworzy nowy obiekt Secret, więc może być
  konieczna aktualizacja odwołań w Podach.
- Pole `stringData` w obiekcie Secret nie współpracuje dobrze z server-side apply.
