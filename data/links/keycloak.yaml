url: https://www.keycloak.org
title: Keycloak
created: 2025-04-18
tldr:
- Keycloak to open-source’owe rozwiązanie Identity and Access Management do uwierzytelniania aplikacji
  i zabezpieczania usług.
- Zapewnia Single Sign-On i Single Sign-Out, dzięki czemu użytkownicy logują się raz, aby uzyskać dostęp
  do wielu aplikacji.
- Obsługuje OpenID Connect, OAuth 2.0 i SAML oraz logowanie społecznościowe i federację tożsamości.
- Łączy się z LDAP i Active Directory; umożliwia też tworzenie własnych providerów użytkowników.
- Konsola administracyjna służy do zarządzania użytkownikami, aplikacjami, sesjami, federacją i politykami
  autoryzacji.
