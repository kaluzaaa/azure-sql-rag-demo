title: DORA
created: 2024-06-20
tldr:
- DORA bada możliwości, które wpływają na wydajność dostarczania oprogramowania i operacji, oraz pomaga
  zespołom je rozwijać.
- Program badawczy DORA jest przedstawiony jako największy i najdłużej działający tego rodzaju.
- Raport o ROI rozwoju oprogramowania wspomaganego przez AI zawiera praktyczne ramy, obliczenia i pytania
  pomocne przy ocenie wdrożenia oraz budżetu.
- DORA Quick Check pozwala porównać wyniki z branżowymi odpowiednikami i wskazuje możliwości poprawy dostarczania
  oprogramowania.
- DORA Core gromadzi najtrwalsze ustalenia programu badawczego i służy jako wskazówka w transformacji
  organizacji.
