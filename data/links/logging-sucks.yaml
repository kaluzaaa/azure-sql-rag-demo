url: https://loggingsucks.com
title: Logging sucks.
author: Boris Tane
created: 2026-02-17
tldr:
- 'Typowe logowanie jest słabo przystosowane do diagnozowania problemów: brakuje mu kontekstu łączącego
  zdarzenia i usługi.'
- Przykład pokazuje 17 linii logów dla jednego udanego żądania; przy 10 000 równoczesnych użytkowników
  autor szacuje 130 000 linii na sekundę.
- Wyszukiwanie tekstowe nie rozumie struktury ani relacji między zdarzeniami; ten sam identyfikator użytkownika
  może być zapisywany na wiele sposobów.
- Structured logging jest konieczne, ale niewystarczające. Wide event, czyli canonical log line, ma być
  jednym kontekstowym zdarzeniem na żądanie i usługę, z ponad 50 polami.
- OpenTelemetry standaryzuje zbieranie i eksport telemetrii, ale nie wybiera, co logować, ani nie dodaje
  kontekstu biznesowego; to wymaga instrumentacji aplikacji.
tags:
