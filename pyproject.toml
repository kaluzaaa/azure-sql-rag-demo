[project]
name = "azure-sql-rag-demo"
version = "0.1.0"
description = "RAG without a vector database: Azure SQL in the lead role (talk demo)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.27.0",
    "ipykernel>=7.4.0",
    "mssql-python>=1.18.0",
    "nbclient>=0.11.0",
    "openai>=3.55.1",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "demo"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
